---
- name: Validate required edge inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - edge_interface | length > 0
      - edge_vip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}$')
      - edge_unicast_peer is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - edge_vrrp_password | length >= 8
      - edge_haproxy_tls_certificate | length > 0
      - edge_haproxy_backends | length >= 2
    fail_msg: Provide isolated lab topology values and an encrypted VRRP secret.
  no_log: true

- name: Install edge packages
  ansible.builtin.apt:
    name:
      - haproxy
      - keepalived
      - prometheus-node-exporter
      - prometheus-haproxy-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install VIP health script
  ansible.builtin.copy:
    src: check-haproxy.sh
    dest: /usr/local/libexec/check-haproxy.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart keepalived

- name: Configure HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0640"
    validate: haproxy -c -f %s
  notify: Restart haproxy

- name: Configure Keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  diff: false
  notify: Restart keepalived

- name: Create HAProxy systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install HAProxy hardening override
  ansible.builtin.copy:
    src: haproxy-hardening.conf
    dest: /etc/systemd/system/haproxy.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart haproxy

- name: Enable edge services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - haproxy
    - keepalived
    - prometheus-node-exporter
    - prometheus-haproxy-exporter
