---
all:
  children:
    edge:
      vars:
        ansible_user: edgeadmin
        edge_interface: ens192
        edge_vip: 192.0.2.50/24
        edge_vrrp_router_id: 51
        edge_vrrp_password: "{{ vault_edge_vrrp_password }}"
        edge_haproxy_tls_certificate: /etc/haproxy/tls/lab.pem
        edge_haproxy_backends:
          - { name: app_a, address: 192.0.2.101, port: 8443 }
          - { name: app_b, address: 192.0.2.102, port: 8443 }
      hosts:
        edge-a:
          ansible_host: 192.0.2.11
          edge_vrrp_priority: 110
          edge_unicast_peer: 192.0.2.12
        edge-b:
          ansible_host: 192.0.2.12
          edge_vrrp_priority: 100
          edge_unicast_peer: 192.0.2.11
